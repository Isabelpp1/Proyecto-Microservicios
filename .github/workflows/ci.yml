name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - servicio-usuarios
          - servicio-productos
          - servicio-pedidos
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: npm test
      - name: Syntax check
        shell: bash
        run: |
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          if [ -d public ]; then
            find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          fi

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare example environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config
